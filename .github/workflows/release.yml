# Release workflow for the public template repository.
# Install as .github/workflows/release.yml. On a tag v*, packs the committed site/
# (produced on a maintainer machine by `build.sh --vendor`, which verifies the hub
# against manifest.lock.json) after checking every file against site.lock.json and
# re-running the leak scan. No network: GitHub-hosted runners get HTTP 403 from
# every aitherium.com host (measured 2026-09-26). Attaches site.tar.gz to a NEW
# release for that tag.
# Spaces download releases/latest/download/site.tar.gz on every deploy.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Verify the committed site and pack it
        run: |
          python3 space/lock.py verify site.lock.json site
          python3 space/patch.py --scan site
          mkdir -p dist
          tar -czf dist/site.tar.gz -C site .

      - name: Smoke-test the tarball
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xzf dist/site.tar.gz -C "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/chat.html"
          test -f "$RUNNER_TEMP/site/space.js"
          test -d "$RUNNER_TEMP/site/workers"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A published tag is immutable: Spaces may already be serving its bytes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; cut a new tag instead" >&2
            exit 1
          fi
          gh release create "$TAG" dist/site.tar.gz --title "$TAG" \
            --notes "Elysium site bundle. Extract into the site directory, then add aither.config.json beside index.html."
