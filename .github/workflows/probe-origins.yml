name: probe-origins
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://elysium.aitherium.com/manifest.json https://aitherium.com/gobbonet/manifest.json https://aitherium.com/workers/manifest.json; do
            printf '%s -> ' "$u"; curl -s -o /dev/null -w '%{http_code}\n' "$u"
            printf '%s (browser UA) -> ' "$u"; curl -s -o /dev/null -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' -w '%{http_code}\n' "$u"
          done
